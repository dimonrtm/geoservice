# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this ini file.
script_location = %(here)s/utility_service/infrastructure/postgresql/alembic

# sys.path path, prepended to sys.path.
prepend_sys_path = .

path_separator = os

# Database URL is overridden by env.py from DATABASE_URL when present.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
