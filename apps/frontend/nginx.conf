map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Не записываем query string: WebSocket использует одноразовый ticket.
log_format api_safe '$remote_addr $request_method $uri $status $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://utility_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        access_log /var/log/nginx/access.log api_safe;
        # Ошибки nginx могут содержать полный запрос вместе с ticket.
        error_log /var/log/nginx/error.log crit;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
