name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev
      - name: Black version
        run: docker run --rm --entrypoint bash utility_service:dev -lc "black --version"
      - name: Black check
        run: docker run --rm --entrypoint bash utility_service:dev -lc "black --check ."

  backend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Ruff check
        run: docker run --rm --entrypoint bash utility_service:dev -lc "ruff check ."

  backend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Pytest
        run: docker run --rm --entrypoint bash utility_service:dev -lc "pytest"

  backend_build_prod:
    runs-on: ubuntu-latest
    needs: [backend_format, backend_lint, backend_test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend prod image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: prod
          tags: utility_service:prod
          load: true
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  smoke_test:
    runs-on: ubuntu-latest
    needs: [backend_test]
    steps:
      - uses: actions/checkout@v4

      - name: Compose production-safe config rejects missing env
        working-directory: infra
        run: |
          : > /tmp/empty-compose.env
          if env -u DB_NAME -u DB_USER -u DB_PASSWORD -u DATABASE_URL -u JWT_SECRET \
            docker compose --env-file /tmp/empty-compose.env \
            -f docker-compose.yml config >/tmp/base-compose.out 2>/tmp/base-compose.err; then
            echo "Expected production-safe compose config to fail without required env"
            cat /tmp/base-compose.out
            exit 1
          fi
          cat /tmp/base-compose.err
          grep -E "DB_NAME is required|DB_USER is required|DB_PASSWORD is required|DATABASE_URL is required|JWT_SECRET is required" /tmp/base-compose.err

      - name: Compose production-safe config guards
        working-directory: infra
        env:
          DB_NAME: geo
          DB_USER: postgres
          DB_PASSWORD: postgres
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgis:5432/geo
          JWT_SECRET: ci-compose-config-secret
        run: |
          docker compose \
            -f docker-compose.yml config --quiet

      - name: Compose demo config guard
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml --profile dev config --quiet

      - name: Start postgis + utility_service (demo compose)
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml up -d --build postgis utility_service
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml ps

      - name: Wait for utility_service health
        working-directory: infra
        run: |
          CID="$(docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml ps -q utility_service)"
          echo "utility_service container id: $CID"
          for i in $(seq 1 30); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo unknown)"
            echo "wait #$i: utility_service health = $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 2
          done
          STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo unknown)"
          if [ "$STATUS" != "healthy" ]; then
            echo "utility_service did not become healthy"
            docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml ps
            docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml logs utility_service --tail=200
            exit 1
          fi

      - name: GET /health inside container
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); print('health ok')"

      - name: PostgreSQL/PostGIS tests in isolated database
        working-directory: infra
        run: |
          read_demo_fingerprint() {
            docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T postgis \
              psql -U postgres -d geo -At -c "
                SELECT 'work_order|' || w.id || '|' || w.status
                FROM work_order.work_orders w WHERE w.code = 'WO-001'
                UNION ALL
                SELECT 'default_state|' || ds.id || '|' || ds.work_order_id
                FROM utility_network.default_states ds
                JOIN work_order.work_orders w ON w.id = ds.work_order_id
                WHERE w.code = 'WO-001'
                UNION ALL
                SELECT 'edit_version|' || ev.id || '|' || ev.status
                FROM work_order.edit_versions ev
                JOIN work_order.work_orders w ON w.id = ev.work_order_id
                WHERE w.code = 'WO-001'
                ORDER BY 1;"
          }

          DEMO_FINGERPRINT_BEFORE="$(read_demo_fingerprint)"
          set +e
          docker compose -p geoservice-db-tests -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from backend_db_tests
          DB_TEST_EXIT=$?
          set -e
          DEMO_FINGERPRINT_AFTER="$(read_demo_fingerprint)"

          if [ "$DEMO_FINGERPRINT_BEFORE" != "$DEMO_FINGERPRINT_AFTER" ]; then
            echo "Demo database changed during isolated DB tests"
            exit 1
          fi
          exit "$DB_TEST_EXIT"

      - name: Shutdown isolated DB test compose
        if: always()
        working-directory: infra
        run: docker compose -p geoservice-db-tests -f docker-compose.test.yml down -v --remove-orphans

      - name: Utility dataset authenticated API smoke
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service \
            python -m seeds.runners.seed_utility_dataset
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service python -c \
            "import json, urllib.request; \
            login=urllib.request.Request( \
              'http://127.0.0.1:8000/api/v1/auth/login', \
              data=json.dumps({ \
                'email':'alexey.editor@example.local', \
                'password':'alexey-editor-password' \
              }).encode(), \
              headers={'Content-Type':'application/json'} \
            ); \
            token=json.load(urllib.request.urlopen(login))['access_token']; \
            request=urllib.request.Request( \
              'http://127.0.0.1:8000/api/v1/utility-network/feeders/6c13a4d8-8d67-4fb3-a1f9-4ea5ab7f0101', \
              headers={'Authorization':'Bearer '+token} \
            ); \
            payload=json.load(urllib.request.urlopen(request)); \
            assert payload['code']=='synthetic_utility_feeder_01'; \
            assert len(payload['network']['features'])==19; \
            assert len(payload['associations'])==9; \
            print('utility dataset api ok')"

      - name: Workspace authenticated API smoke
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service \
            python -m seeds.runners.seed_work_orders
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service python -c \
            "import json, urllib.request; \
            work_order_id='6c13a4d8-8d67-4fb3-a1f9-4ea5ab7f0401'; \
            login=urllib.request.Request( \
              'http://127.0.0.1:8000/api/v1/auth/login', \
              data=json.dumps({ \
                'email':'alexey.editor@example.local', \
                'password':'alexey-editor-password' \
              }).encode(), \
              headers={'Content-Type':'application/json'} \
            ); \
            token=json.load(urllib.request.urlopen(login))['access_token']; \
            open_request=urllib.request.Request( \
              f'http://127.0.0.1:8000/api/v1/work-orders/{work_order_id}/edit-versions', \
              data=b'', \
              headers={'Authorization':'Bearer '+token}, \
              method='POST' \
            ); \
            edit_version=json.load(urllib.request.urlopen(open_request))['editVersion']; \
            edit_version_id=edit_version['id']; \
            workspace_request=urllib.request.Request( \
              f'http://127.0.0.1:8000/api/v1/work-orders/{work_order_id}/edit-versions/{edit_version_id}/workspace', \
              headers={'Authorization':'Bearer '+token} \
            ); \
            payload=json.load(urllib.request.urlopen(workspace_request)); \
            assert payload['workOrder']['id']==work_order_id; \
            assert payload['workOrder']['scope']['aoi']['id']=='6c13a4d8-8d67-4fb3-a1f9-4ea5ab7f0100'; \
            assert payload['workOrder']['editVersion']['id']==edit_version_id; \
            assert len(payload['workOrder']['editVersion']['features']['features'])==19; \
            assert len(payload['workOrder']['editVersion']['associations'])==9; \
            print('workspace api ok')"

      - name: Full path workspace API smoke
        working-directory: infra
        run: |
          docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml exec -T utility_service \
            python tests/smoke/full_path_workspace_smoke.py

      - name: Shutdown compose
        if: always()
        working-directory: infra
        run: docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml down -v

  frontend_format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Prettier check
        working-directory: apps/frontend
        run: npm run format:check

  frontend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: ESLint
        working-directory: apps/frontend
        run: npm run lint

  frontend_typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Typecheck
        working-directory: apps/frontend
        run: npm run typecheck

  frontend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Unit tests
        working-directory: apps/frontend
        run: npm test

  frontend_build:
    runs-on: ubuntu-latest
    needs: [frontend_format_check, frontend_lint, frontend_typecheck, frontend_test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Build
        working-directory: apps/frontend
        run: npm run build
