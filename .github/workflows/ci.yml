name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev
      - name: Black version
        run: docker run --rm --entrypoint bash utility_service:dev -lc "black --version"
      - name: Black check
        run: docker run --rm --entrypoint bash utility_service:dev -lc "black --check ."

  backend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Ruff check
        run: docker run --rm --entrypoint bash utility_service:dev -lc "ruff check ."

  backend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: dev
          tags: utility_service:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Pytest
        run: docker run --rm --entrypoint bash utility_service:dev -lc "pytest"

  backend_build_prod:
    runs-on: ubuntu-latest
    needs: [backend_format, backend_lint, backend_test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend prod image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: prod
          tags: utility_service:prod
          load: true
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  smoke_test:
    runs-on: ubuntu-latest
    needs: [backend_test]
    steps:
      - uses: actions/checkout@v4

      - name: Start postgis + utility_service (compose)
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml up -d --build postgis utility_service
          docker compose -f docker-compose.yml ps

      - name: Wait for utility_service health
        working-directory: infra
        run: |
          CID="$(docker compose -f docker-compose.yml ps -q utility_service)"
          echo "utility_service container id: $CID"
          for i in $(seq 1 30); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo unknown)"
            echo "wait #$i: utility_service health = $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 2
          done
          STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo unknown)"
          if [ "$STATUS" != "healthy" ]; then
            echo "utility_service did not become healthy"
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs utility_service --tail=200
            exit 1
          fi

      - name: GET /health inside container
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml exec -T utility_service python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); print('health ok')"

      - name: PostgreSQL/PostGIS network model tests
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_network_model_integration.py -q
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_network_model_migration.py -q
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_edit_version_migration.py -q
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_seed_utility_dataset_integration.py -q
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_work_order_seed_chain_integration.py -q
          docker compose -f docker-compose.yml exec -T utility_service env RUN_DB_TESTS=1 \
            pytest tests/integration_tests/test_utility_network_repository_integration.py -q

      - name: Utility dataset authenticated API smoke
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml exec -T utility_service \
            python -m seeds.runners.seed_utility_dataset
          docker compose -f docker-compose.yml exec -T utility_service python -c \
            "import json, urllib.request; \
            login=urllib.request.Request( \
              'http://127.0.0.1:8000/api/v1/auth/login', \
              data=json.dumps({ \
                'email':'alexey.editor@example.local', \
                'password':'alexey-editor-password' \
              }).encode(), \
              headers={'Content-Type':'application/json'} \
            ); \
            token=json.load(urllib.request.urlopen(login))['access_token']; \
            request=urllib.request.Request( \
              'http://127.0.0.1:8000/api/v1/utility-network/feeders/6c13a4d8-8d67-4fb3-a1f9-4ea5ab7f0101', \
              headers={'Authorization':'Bearer '+token} \
            ); \
            payload=json.load(urllib.request.urlopen(request)); \
            assert payload['code']=='synthetic_utility_feeder_01'; \
            assert len(payload['network']['features'])==19; \
            assert len(payload['associations'])==9; \
            print('utility dataset api ok')"

      - name: Teardown
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.yml down -v

  frontend_format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Prettier check
        working-directory: apps/frontend
        run: npm run format:check

  frontend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: ESLint
        working-directory: apps/frontend
        run: npm run lint

  frontend_typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Typecheck
        working-directory: apps/frontend
        run: npm run typecheck

  frontend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Unit tests
        working-directory: apps/frontend
        run: npm test

  frontend_build:
    runs-on: ubuntu-latest
    needs: [frontend_format_check, frontend_lint, frontend_typecheck, frontend_test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install deps
        working-directory: apps/frontend
        run: npm ci

      - name: Build
        working-directory: apps/frontend
        run: npm run build
