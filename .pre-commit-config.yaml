repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^infra/docker-compose\.smoke\.yml$
      - id: check-yaml
        name: check yaml (Compose extension tags)
        files: ^infra/docker-compose\.smoke\.yml$
        args: ["--unsafe"]
      - id: check-json
        exclude: ^apps/frontend/tsconfig\.(app|node)\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]

  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
